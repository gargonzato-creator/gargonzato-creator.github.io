.stat.wide { grid-column: 1 / -1; min-height: 80px; }

.login-sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin: 12px 0; }

  .stats { max-width: 640px; grid-template-columns: repeat(4, 1fr); }
}
@media print {
  .no-print, .tabs, .menu-back { display: none !important; }
  body { background: white; }
  .screen { max-width: none; padding: 0; }
  .sheet { border: 0; box-shadow: none; }
  @page { size: A4 portrait; margin: 12mm; }
}
</style>

<script>
/* TG Auth Guard (compartido Formulador / María Elena).
   - Origen canónico de Firebase Hosting: tg-apps-bbde7.firebaseapp.com (mismo origen que authDomain, sin storage de terceros).
   - Detecta navegadores internos de apps (WebView) y fallas de la ventana de Google, y muestra «Abrí esta app en Safari». */
(function (w) {
  "use strict";
  var HOST_AUTH = "tg-apps-bbde7.firebaseapp.com";
  try {
    if (location.hostname === "tg-apps-bbde7.web.app") {
      location.replace("https://" + HOST_AUTH + location.pathname + location.search + location.hash);
    }
  } catch (e) {}
  var KEY = "tg-auth-intento";
  var ua = String((w.navigator && navigator.userAgent) || "");
  function esIOS() {
    return /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function standalone() {
    try { if (navigator.standalone === true) return true; } catch (e) {}
    try { return !!(w.matchMedia && w.matchMedia("(display-mode: standalone)").matches); } catch (e) { return false; }
  }
  function enAppInterna() {
    if (/[?&]safari=1(?:&|$)/.test(String(location.search || ""))) return true; // prueba
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|MicroMessenger|WhatsApp|Twitter|Snapchat|LinkedInApp|GSA\/|Telegram|Grok|xAI|Cursor|; wv\)|WebView/i.test(ua)) return true;
    // WKWebView de iOS: no trae "Safari/" (salvo el ícono de inicio, que se excluye).
    if (esIOS() && !standalone() && !/Safari\//.test(ua)) return true;
    return false;
  }
  function mismoOrigen(cfg) {
    try { return !!cfg && location.hostname === String(cfg.authDomain || ""); } catch (e) { return false; }
  }
  function lsGet(k) { try { return w.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { w.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { w.localStorage.removeItem(k); } catch (e) {} }
  var intentoEstaPagina = false;
  function marcarIntento(tipo) { intentoEstaPagina = true; lsSet(KEY, JSON.stringify({ t: Date.now(), tipo: tipo || "popup" })); }
  function limpiarIntento() { lsDel(KEY); }
  function intentoReciente() {
    // Solo cuenta un intento de una carga anterior (volvió a la app sin sesión); el de esta pantalla se informa por su error.
    if (intentoEstaPagina) return null;
    var raw = lsGet(KEY);
    if (!raw) return null;
    try {
      var d = JSON.parse(raw);
      if (d && Date.now() - d.t < 15 * 60 * 1000) return d;
    } catch (e) {}
    lsDel(KEY);
    return null;
  }
  function esFallaDeVentana(code) {
    return code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment" ||
      code === "auth/web-storage-unsupported" || code === "auth/popup-closed-by-user" ||
      code === "auth/cancelled-popup-request" || code === "auth/internal-error" || code === "auth/missing-initial-state";
  }
  function enlace() {
    try { return location.origin + location.pathname; } catch (e) { return String(location.href || ""); }
  }
  function enlaceSafari() {
    var u = enlace();
    return esIOS() && /^https:\/\//.test(u) ? "x-safari-" + u : "";
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&"+"amp;", "<": "&"+"lt;", ">": "&"+"gt;", '"': "&"+"quot;", "'": "&#39;" }[c]; }); }
  function htmlAviso(motivo) {
    var u = enlace();
    var h = '<div class="tg-safari" role="alert">';
    h += "<b>Abrí esta app en Safari</b>";
    h += "<p>" + esc(motivo || "Este navegador interno no deja terminar el ingreso con Google.") + "</p>";
    h += "<ol><li>Tocá «Copiar enlace».</li><li>Abrí Safari, pegalo en la barra y entrá con Google.</li><li>En Safari: Compartir → «Agregar a inicio», y abrí siempre desde ese ícono.</li></ol>";
    h += '<div class="tg-safari-url">' + esc(u) + "</div>";
    h += '<button type="button" class="tg-safari-btn" data-tgauth="copiar">Copiar enlace</button>';
    var s = enlaceSafari();
    if (s) h += '<a class="tg-safari-btn tg-safari-sec" href="' + esc(s) + '">Abrir en Safari</a>';
    return h + "</div>";
  }
  function htmlPista() {
    if (!esIOS() || standalone()) return "";
    return '<p class="tg-safari-pista">¿Google no responde? <button type="button" data-tgauth="copiar">Copiar enlace</button> y abrilo en Safari.</p>';
  }
  function copiar(btn) {
    var u = enlace();
    function ok() { if (btn) { btn.textContent = "Enlace copiado ✓"; setTimeout(function () { btn.textContent = "Copiar enlace"; }, 2500); } }
    function viejo() {
      try {
        var t = document.createElement("textarea");
        t.value = u; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select(); t.setSelectionRange(0, u.length);
        var r = document.execCommand("copy"); t.remove();
        if (r) ok(); else w.prompt("Copiá este enlace:", u);
      } catch (e) { w.prompt("Copiá este enlace:", u); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(ok, viejo);
    else viejo();
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-tgauth="copiar"]') : null;
    if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    copiar(b);
  }, true);
  try {
    var st = document.createElement("style");
    st.textContent = ".tg-safari{background:#fff6e0;border:1px solid #e6c36a;border-radius:14px;padding:14px 16px;margin:12px 0;color:#3b2f12;text-align:left;font-size:15px;line-height:1.4}" +
      ".tg-safari b{display:block;font-size:17px;margin-bottom:4px}.tg-safari p{margin:4px 0 6px}.tg-safari ol{margin:6px 0 8px 18px;padding:0}" +
      ".tg-safari-url{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;border-radius:8px;padding:6px 8px;word-break:break-all;margin-bottom:8px}" +
      ".tg-safari-btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:12px;border-radius:12px;border:0;background:#2f6b3a;color:#fff;font-size:16px;font-weight:600;margin-top:6px;text-decoration:none;cursor:pointer}" +
      ".tg-safari-sec{background:#fff;color:#2f6b3a;border:1px solid #2f6b3a}" +
      ".tg-safari-pista{font-size:13px;color:#776b55;text-align:center;margin:10px 0 0}.tg-safari-pista button{background:none;border:0;color:#2f6b3a;text-decoration:underline;font-size:13px;padding:0;cursor:pointer}";
    (document.head || document.documentElement).appendChild(st);
  } catch (e) {}
  w.TGAuth = {
    HOST_AUTH: HOST_AUTH, esIOS: esIOS, standalone: standalone, enAppInterna: enAppInterna, mismoOrigen: mismoOrigen,
    marcarIntento: marcarIntento, limpiarIntento: limpiarIntento, intentoReciente: intentoReciente,
    esFallaDeVentana: esFallaDeVentana, htmlAviso: htmlAviso, htmlPista: htmlPista, copiar: copiar, enlace: enlace
  };
})(window);
</script>
<script>
/* ========== FIREBASE — pegá acá la configuración del proyecto ==========
   Firebase console → Configuración del proyecto → Tus apps → SDK de la app.
   Si apiKey queda vacío, la app funciona solo en este aparato.

  function actualizarCatalogoProductos(existentes) {
    var lista = (existentes || []).slice();

    var oficial = {};

      oficial[p.id] = p;

        lista.push(p);
        porId[p.id] = p;
      } else {
        var e = porId[p.id];
        e.nombre = p.nombre;
        e.principio = p.principio;
        e.grupo = p.grupo;
        e.via = p.via;
        e.motivo = p.motivo;
      }
    });
    var ahora = new Date().toISOString();
    lista.forEach(function (p) {
      var original = PRODUCTOS_VIEJOS[p.id];
      if (original && !p.deleted && p.nombre === original) {
        p.deleted = true;
        p.deletedAt = ahora;
      }
      if (!oficial[p.id] && CATALOGO_ANTERIOR[p.id] && !p.deleted) {
        p.deleted = true;
        p.deletedAt = ahora;

    });
    return lista;

  function categoriaPorEdad(animal, hoy, eventos) {
    if (!animal) return "";
    var fem = animal.sexo === "hembra";
    var nac = animal.nacimiento;
    var edad = nac ? diasEntre(nac, hoy || hoyISO()) : null;
    var destetado = (eventos || []).some(function (e) {
      return !e.deleted && e.tipo === "destete" && (e.animalId === animal.id || (e.animalIds || []).indexOf(animal.id) >= 0);
    });
    if (animal.categoria === "corderos-pie") return fem ? "Cordera" : "Cordero";
    if (edad == null) {
      if (animal.categoria === "carneros") return "Carnero";
      if (animal.categoria === "ovejas-adultas" || animal.categoria === "ovejas-recuperacion") return "Oveja";
      if (animal.categoria === "borregas-servicio") return "Borrega";
      if (animal.categoria === "corderos-destetados") return fem ? "Cordera" : "Cordero";
      return fem ? "Oveja" : "Carnero";
    }
    if (!destetado && edad < 180) return fem ? "Cordera" : "Cordero";
    var pario = (eventos || []).some(function (e) {
      return !e.deleted && e.tipo === "parto" && e.animalId === animal.id;
    });
    if (fem && !pario && edad < 540) return edad < 365 ? "Borrega" : "Borrega";
    if (!fem && edad < 365) return "Borrego";
    return fem ? "Oveja" : "Carnero";
  }

  function padreDeParto(madreId, fechaParto, eventos) {

    for (i = 0; i < (eventos || []).length; i++) {

      if ((s.datos.ovejaIds || []).indexOf(madreId) < 0 && (s.animalIds || []).indexOf(madreId) < 0) continue;
      entrada = s.datos.entrada || s.fecha;
      salida = s.datos.salida || fechaParto;
      if (concepcion >= entrada && concepcion <= salida) {
        if (!mejor || entrada > (mejor.datos.entrada || mejor.fecha)) mejor = s;

    }

  function pesoBase(db, animalId, fecha) {

  function reportePartos(db, desde, hasta) {

    var i, j, p, ids;

    }
    for (i = 0; i < servicios.length; i++) {

      for (j = 0; j < ids.length; j++) servidas[ids[j]] = true;

  function conTiempo(promesa, ms, etiqueta) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () {
        var e = new Error(etiqueta + ": sin respuesta en " + Math.round(ms / 1000) + " s");
        e.code = "timeout";
        reject(e);
      }, ms);
      promesa.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  function estable(v) {
    if (v === null || typeof v !== "object") return JSON.stringify(v);
    if (Object.prototype.toString.call(v) === "[object Array]") return "[" + v.map(estable).join(",") + "]";
    return "{" + Object.keys(v).sort().filter(function (k) { return v[k] !== undefined; }).map(function (k) { return JSON.stringify(k) + ":" + estable(v[k]); }).join(",") + "}";
  }

  function probarIndexedDB(ms) {
    return new Promise(function (resolve) {
      var listo = false;
      function fin(ok, por) { if (listo) return; listo = true; resolve({ ok: ok, por: por }); }
      setTimeout(function () { fin(false, "IndexedDB no responde"); }, ms);
      try {
        if (!root.indexedDB) return fin(false, "sin IndexedDB");
        var req = root.indexedDB.open("tg-me-prueba", 1);
        req.onsuccess = function () { try { req.result.close(); } catch (e) {} fin(true, ""); };
        req.onerror = function () { fin(false, "IndexedDB con error"); };
        req.onblocked = function () { fin(false, "IndexedDB bloqueado"); };
      } catch (e) {
        fin(false, "IndexedDB: " + (e && e.message ? e.message : e));
      }
    });
  }

    html += '<label class="f">Peso, kg<input inputmode="decimal" data-bind="peso" data-focus="1" value="' + esc(S.b.peso || "") + '" placeholder="0,0"></label>';
    if (!destete) {
      html += '<button type="button" class="btn-ghost" data-act="mas">' + (S.b.mas ? "Ocultar más datos" : "FAMACHA, condición, HPG") + "</button>";
      if (S.b.mas) {

  function htmlProductos(q, elegido) {
    var query = String(q || "").trim().toLowerCase();
    var vivos = productosVivos();
    var html = "";
    var grupos = (L.GRUPOS_PRODUCTO || []).slice();
    var usados = {};
    grupos.forEach(function (g) {
      var lista = vivos.filter(function (p) {
        if ((p.grupo || "otros") !== g.id) return false;
        usados[p.id] = true;
        if (!query) return true;
        var blob = (p.nombre + " " + (p.principio || "") + " " + g.nombre).toLowerCase();
        return blob.indexOf(query) >= 0;
      });
      if (!lista.length) return;
      html += '<h3 class="grupo-prod">' + esc(g.nombre) + "</h3><div class=\"chips\">";
      lista.forEach(function (p) {
        html += '<button type="button" class="chip chip-prod' + (elegido === p.id ? " on" : "") + '" data-act="elegir-producto" data-id="' + esc(p.id) + '"><span>' + esc(p.nombre) + "</span>";
        if (p.principio) html += "<small>" + esc(p.principio) + "</small>";
        html += "</button>";
      });
      html += "</div>";
    });
    var extras = vivos.filter(function (p) {
      if (usados[p.id]) return false;
      if (!query) return true;
      var blob = (p.nombre + " " + (p.principio || "")).toLowerCase();
      return blob.indexOf(query) >= 0;
    });
    if (extras.length) {
      html += '<h3 class="grupo-prod">Tus productos</h3><div class="chips">';
      extras.forEach(function (p) {
        html += '<button type="button" class="chip chip-prod' + (elegido === p.id ? " on" : "") + '" data-act="elegir-producto" data-id="' + esc(p.id) + '"><span>' + esc(p.nombre) + "</span>";
        if (p.principio) html += "<small>" + esc(p.principio) + "</small>";
        html += "</button>";
      });
      html += "</div>";
    }
    if (!html) html = '<div class="card"><p>No hay un producto con esa búsqueda. Probá otra palabra o cargalo en «Otro producto».</p></div>';
    return html;
  }

    filtrar(fn).forEach(function (a) {
      html += '<button type="button" class="rowbtn' + (S.b[bind] === a.id ? " on" : "") + '" data-act="chip" data-bind="' + bind + '" data-val="' + esc(a.id) + '">' + esc(L.etiquetaAnimal(a)) + "</button>";
    });
    if (!html) html = '<div class="card"><p>No hay animales en esta lista.</p></div>';
    return html;
  }

  function selectorAnimal(bind, fn) {
    var html = '<button type="button" class="chip' + (!S.b[bind] ? " on" : "") + '" data-act="chip" data-bind="' + bind + '" data-val="">Sin anotar</button>';
    S.db.animales.filter(function (a) { return !a.deleted && fn(a); }).sort(ordenarCaravana).forEach(function (a) {
      html += '<button type="button" class="chip' + (S.b[bind] === a.id ? " on" : "") + '" data-act="chip" data-bind="' + bind + '" data-val="' + esc(a.id) + '">' + esc(L.etiquetaAnimal(a)) + "</button>";
    });
    return html;
  }

  function ordenarCaravana(a, b) {
    var na = Number(a.caravana);
    var nb = Number(b.caravana);
    if (a.caravana && b.caravana && isFinite(na) && isFinite(nb)) return na - nb;
    if (!a.caravana) return 1;
    if (!b.caravana) return -1;
    return String(a.caravana).localeCompare(String(b.caravana));
  }

  function estadoTexto(estado) {
    if (estado === "vendido") return "Vendido";
    if (estado === "muerto") return "Muerto";
    return "En el campo";
  }

  function productosVivos() {
    return (S.db.productos || []).filter(function (p) { return !p.deleted; });
  }

  function corderosPie() {
    return S.db.animales.filter(function (a) { return !a.deleted && a.estado === "activo" && a.categoria === "corderos-pie"; }).sort(ordenarCaravana);
  }

  function hectareasCargadas() {
    return S.db.potreros.filter(function (p) { return !p.deleted; }).reduce(function (s, p) { return s + (Number(p.hectareas) || 0); }, 0);
  }

  function infoPotrero(p) {
    var lote = L.porId(S.db.lotes, p.loteId);
    var hoy = L.hoyISO();
    if (lote && !lote.deleted) {
      var dias = p.fechaEntrada ? L.diasEntre(p.fechaEntrada, hoy) : null;
      return "Ocupado · " + lote.nombre + (dias != null ? " · " + dias + " días" : "");
    }
    var descanso = p.fechaInicioDescanso ? L.diasEntre(p.fechaInicioDescanso, hoy) : null;
    return "En descanso" + (descanso != null ? " · " + descanso + " días" : "");
  }

  function eventosDe(id) {
    return S.db.eventos.filter(function (e) {
      return !e.deleted && (e.animalId === id || (e.animalIds || []).indexOf(id) >= 0);
    }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
  }

  function textoEvento(e) {
    var d = e.datos || {};
    if (e.tipo === "nacimiento") return "Nacimiento" + (d.peso != null ? " · " + L.fmtNum(d.peso, 1) + " kg" : "") + (d.vivo === false ? " · muerto" : "");
    if (e.tipo === "parto") return "Parto " + (d.tipo || "") + " · " + ((d.corderos || []).length) + " crías";
    if (e.tipo === "servicio") return (d.modo === "ia" ? "Inseminación" : "Monta") + " · entra " + L.fmtFecha(d.entrada) + (d.salida ? " · sale " + L.fmtFecha(d.salida) : "");
    if (e.tipo === "diagnostico") return "Preñez: " + ({ prenada: "preñada", vacia: "vacía", mellizos: "mellizos" }[d.resultado] || d.resultado);
    if (e.tipo === "destete") return "Destete · " + L.fmtNum(d.peso, 1) + " kg" + (d.edad != null ? " · " + d.edad + " días" : "") + (d.gdp != null ? " · " + d.gdp + " g/día" : "");
    if (e.tipo === "pesaje") return "Pesaje · " + L.fmtNum(d.peso, 1) + " kg" + (d.gdp != null ? " · " + d.gdp + " g/día" : "") + (d.famacha ? " · FAMACHA " + d.famacha : "") + (d.cc ? " · condición " + d.cc : "");
    if (e.tipo === "sanidad") return (d.productoNombre || "Tratamiento") + (d.dosis ? " · " + d.dosis : "") + (d.retiroHasta ? " · no faenar hasta " + L.fmtFecha(d.retiroHasta) : "");
    if (e.tipo === "hpg-control") return "HPG " + d.hpg + (d.reduccion != null ? " · baja " + String(d.reduccion).replace(".", ",") + " %" : "");
    if (e.tipo === "muerte") return "Muerte · " + (L.nombreDe(L.CAUSAS, d.causa) || d.causaOtro || "");
    if (e.tipo === "venta") return "Venta";
    if (e.tipo === "movimiento") return "Cambio de potrero";
    if (e.tipo === "suplemento") return "Balanceado " + L.fmtNum(d.gramosDia, 0) + " g/día";
    return e.tipo;
  }

  function idsElegidos() {
    return Object.keys(S.b.elegidos || {});
  }

  function pesoVivo(a, destete) {
    if (!a) return null;
    if (destete && a.pesoNacer != null) return { peso: a.pesoNacer, fecha: a.nacimiento };
    return L.pesoBase(S.db, a.id, S.b.fecha);
  }

  function leerForm() {
    document.querySelectorAll("input[data-bind], select[data-bind], textarea[data-bind]").forEach(function (el) {
      S.b[el.getAttribute("data-bind")] = el.value;
    });
  }

  function tomarCria() {
    return { sexo: S.b.sexo, vivo: S.b.vivo || "vivo", peso: S.b.peso || "", caravana: S.b.caravana || "" };
  }

  function guardarServicio(confirmar) {
    leerForm();
    S.b.entrada = S.b.fecha;
    S.b.ovejaIds = idsElegidos();
    S.b.confirmarParentesco = !!confirmar;
    var res = Store.registrarServicio(S.db, S.b, uid());
    if (!res.ok && res.avisos && !confirmar) {
      S.b.avisos = res.avisos;
      S.screen = "servicio-aviso";
      S.error = "";
      pintar();
      return;
    }
    if (res.ok) {
      S.b.paricion = res.paricion;
      S.b.ecografia = res.ecografia;
      S.b.servicioId = res.evento.id;
    }
    aplicar(res, "Quedó guardado el servicio.");
  }

  function empezarSeq(ids, screen) {
    var lista = ids.slice().sort(function (a, b) {
      return ordenarCaravana(L.porId(S.db.animales, a) || {}, L.porId(S.db.animales, b) || {});
    });
    if (!lista.length) { S.error = "Elegí al menos uno."; pintar(); return; }
    S.b.lista = lista;
    S.b.i = 0;
    S.b.items = [];
    S.b.peso = "";
    S.b.cc = "";
    S.b.famacha = "";
    S.b.hpg = "";
    S.b.hematocrito = "";
    S.error = "";
    S.screen = screen;
    pintar();
  }

  function guardarItemPeso(destete) {
    leerForm();
    var id = (S.b.lista || [])[S.b.i || 0];
    var a = L.porId(S.db.animales, id);
    var peso = L.parseNum(S.b.peso);
    if (peso == null) { S.error = "Falta el peso."; pintar(); return; }
    var item = { animalId: id, peso: S.b.peso, cc: S.b.cc || "", famacha: S.b.famacha || "", hpg: S.b.hpg || "", hematocrito: S.b.hematocrito || "" };
    var items = (S.b.items || []).concat([item]);
    var siguiente = (S.b.i || 0) + 1;
    if (siguiente < (S.b.lista || []).length) {
      S.b.items = items;
      S.b.i = siguiente;
      S.b.peso = "";
      S.b.cc = "";
      S.b.famacha = "";
      S.b.hpg = "";
      S.b.hematocrito = "";
      S.error = "";
      pintar();
      return;
    }
    var res = destete
      ? Store.registrarDestete(S.db, { fecha: S.b.fecha, items: items }, uid())
      : Store.registrarPesaje(S.db, { fecha: S.b.fecha, items: items }, uid());
    if (!res.ok) { S.error = res.error; pintar(); return; }
    var antes = Store.clonar(S.db);
    S.db = res.db;
    guardarLocal();
    subirNube();
    S.deshacer = { db: antes };
    S.b.filas = res.filas;
    S.b.texto = destete ? "Quedó guardado el destete." : "Quedó guardado el pesaje.";
    S.pila = [];
    S.screen = "hecho";
    S.error = "";
    pintar();
  }

  function ano() { return String(new Date().getFullYear()); }

  function armarReporte(id, desde, hasta) {
    if (id === "existencias") return repExistencias();
    if (id === "partos") return repPartos(desde, hasta);
    if (id === "mortandad") return repMuertes(desde, hasta);
    if (id === "destete") return repDestete(desde, hasta);
    if (id === "pesajes") return repPesajes();
    if (id === "sanidad") return repSanidad();
    if (id === "potreros") return repPotreros();
    return { html: "", texto: "Cabaña María Elena" };
  }

  function cabeza(titulo) {
    return "<h2>Cabaña María Elena</h2><p>" + esc(titulo) + "</p>";
  }

  function repExistencias() {
    var r = L.reporteExistencias(S.db);
    var texto = L.textoExistencias(S.db, L.hoyISO());
    var html = cabeza("Existencias al " + L.fmtFecha(L.hoyISO()));
    html += "<table><tbody>";
    L.CATEGORIAS.forEach(function (c) {
      html += "<tr><td>" + esc(c.nombre) + "</td><td class=\"num\">" + (r.porCat[c.id] || 0) + "</td></tr>";
    });
    html += "<tr><td><b>Total en el campo</b></td><td class=\"num\"><b>" + r.total + "</b></td></tr>";
    html += "</tbody></table>";
    html += "<p>Vendidos anotados: " + r.vendidos + ". Muertos anotados: " + r.muertos + ".</p>";
    return { html: html, texto: texto };
  }

  function repPartos(desde, hasta) {
    var r = L.reportePartos(S.db, desde, hasta);
    var html = cabeza("Partos del " + L.fmtFecha(desde) + " al " + L.fmtFecha(hasta));
    html += "<p>Partos: " + r.partos + "</p>";
    html += "<p>Ovejas que parieron: " + r.ovejasParidas + "</p>";
    html += "<p>Ovejas servidas en el período: " + r.ovejasServidas + "</p>";
    html += "<p>Crías: " + r.corderos + " · vivas " + r.vivos + " · muertas " + r.muertos + "</p>";
    html += "<p>De cada 100 ovejas servidas, parieron " + (r.paricion == null ? "—" : String(r.paricion).replace(".", ",")) + ".</p>";
    html += "<p>Crías vivas por oveja que parió: " + (r.prolificidad == null ? "—" : String(r.prolificidad).replace(".", ",")) + ".</p>";
    var texto = "Cabaña María Elena\nPartos\nPartos: " + r.partos + "\nOvejas que parieron: " + r.ovejasParidas + "\nOvejas servidas: " + r.ovejasServidas + "\nCrías vivas: " + r.vivos + "\nParición: " + (r.paricion == null ? "-" : r.paricion) + " %\nCrías vivas por parto: " + (r.prolificidad == null ? "-" : r.prolificidad);
    return { html: html, texto: texto };
  }

  function repMuertes(desde, hasta) {
    var r = L.reporteMortandad(S.db, desde, hasta);
    var html = cabeza("Muertes del " + L.fmtFecha(desde) + " al " + L.fmtFecha(hasta));
    html += "<p>Total: " + r.total + (r.porcentaje == null ? "" : " · " + String(r.porcentaje).replace(".", ",") + " %") + "</p><table><tbody>";
    var texto = "Cabaña María Elena\nMuertes: " + r.total + (r.porcentaje == null ? "" : " (" + r.porcentaje + "%)");
    L.CAUSAS.forEach(function (c) {
      if (!r.porCausa[c.id]) return;
      html += "<tr><td>" + esc(c.nombre) + "</td><td class=\"num\">" + r.porCausa[c.id] + "</td></tr>";
      texto += "\n" + c.nombre + ": " + r.porCausa[c.id];
    });
    html += "</tbody></table>";
    return { html: html, texto: texto };
  }

  function repDestete(desde, hasta) {
    var r = L.reporteDestete(S.db, desde, hasta);
    var html = cabeza("Destete del " + L.fmtFecha(desde) + " al " + L.fmtFecha(hasta));
    html += "<p>Destetados: " + r.cantidad + "</p>";
    html += "<p>Peso promedio: " + (r.pesoPromedio == null ? "sin pesos" : L.fmtNum(r.pesoPromedio, 1) + " kg") + "</p>";
    html += "<p>Ganancia promedio: " + (r.gdpPromedio == null ? "sin datos" : r.gdpPromedio + " g/día") + "</p>";
    return { html: html, texto: "Cabaña María Elena\nDestete\nCantidad: " + r.cantidad + "\nPeso promedio: " + (r.pesoPromedio == null ? "-" : r.pesoPromedio) + " kg\nGanancia: " + (r.gdpPromedio == null ? "-" : r.gdpPromedio) + " g/día" };
  }

  function repPesajes() {
    var filas = L.reportePesajes(S.db);
    var html = cabeza("Último pesaje");
    html += "<table><tbody>";
    var texto = "Cabaña María Elena\nPesajes";
    filas.forEach(function (f) {
      html += "<tr><td>" + esc(f.caravana || "s/c") + "</td><td>" + esc(L.nombreDe(L.CATEGORIAS, f.categoria)) + "</td><td class=\"num\">" + (f.peso == null ? "—" : esc(L.fmtNum(f.peso, 1))) + "</td><td class=\"num\">" + (f.gdp == null ? "" : f.gdp + " g") + "</td></tr>";
      texto += "\n" + (f.caravana || "s/c") + " " + (f.peso == null ? "sin pesaje" : f.peso + " kg") + (f.gdp == null ? "" : " " + f.gdp + " g/día");
    });
    html += "</tbody></table>";
    if (!filas.length) html += "<p>No hay animales en el campo.</p>";
    return { html: html, texto: texto };
  }

  function repSanidad() {
    var r = L.reporteSanidad(S.db, L.hoyISO());
    var html = cabeza("Sanidad");
    html += "<h3>No faenar ni vender</h3>";
    var texto = "Cabaña María Elena\nSanidad";
    if (!r.retiros.length) html += "<p>Nadie está en retiro.</p>";
    r.retiros.forEach(function (e) {
      html += "<p>" + esc(e.datos.productoNombre || "Tratamiento") + " hasta el " + esc(L.fmtFecha(e.datos.retiroHasta)) + "</p>";
      texto += "\nNo faenar " + (e.datos.productoNombre || "") + " hasta " + L.fmtFecha(e.datos.retiroHasta);
    });
    html += "<h3>Próximos</h3>";
    if (!r.proximos.length) html += "<p>No hay recordatorios.</p>";
    r.proximos.forEach(function (rec) {
      html += "<p>" + esc(L.fmtFecha(rec.fecha)) + " · " + esc(rec.texto) + "</p>";
      texto += "\n" + L.fmtFecha(rec.fecha) + " " + rec.texto;
    });
    html += "<h3>Hechos</h3>";
    r.hechos.slice(0, 15).forEach(function (e) {
      html += "<p>" + esc(L.fmtFecha(e.fecha)) + " · " + esc(textoEvento(e)) + "</p>";
    });
    return { html: html, texto: texto };
  }

  function repPotreros() {
    var filas = L.reportePotreros(S.db, L.hoyISO());
    var html = cabeza("Potreros");
    var texto = "Cabaña María Elena\nPotreros";
    if (!filas.length) html += "<p>Todavía no hay potreros.</p>";
    filas.forEach(function (p) {
      var estado = p.ocupado ? "Ocupado" + (p.lote ? " · " + p.lote : "") : "Descanso";
      html += "<p><b>" + esc(p.nombre) + "</b> · " + esc(estado) + (p.dias != null ? " · " + p.dias + " días" : "") + (p.pastura ? " · " + esc(p.pastura) : "") + "</p>";
      texto += "\n" + p.nombre + " " + estado + (p.dias != null ? " " + p.dias + " días" : "");
    });
    return { html: html, texto: texto };
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act !== "chip" && act !== "toggle" && act !== "diag" && act !== "mas") leerForm();
    if (act === "volver") return volver();
    if (act === "cerrar-menu") { S.menu = false; return pintar(); }
    if (act === "tab") {
      var tab = t.getAttribute("data-tab");
      if (tab === "nuevo") { S.menu = !S.menu; return pintar(); }
      S.menu = false;
      S.pila = [];
      S.error = "";
      if (tab === "home") { S.screen = "home"; S.b = {}; return pintar(); }
      if (tab === "animales") { S.screen = "animales"; S.b = { q: "", filtro: "campo" }; return pintar(); }
      if (tab === "reportes") { S.screen = "reportes"; S.b = {}; return pintar(); }
      if (tab === "mas") { S.screen = "mas"; S.b = {}; return pintar(); }
    }
    if (act === "ver-grupo") {
      S.menu = false;
      S.pila = [];
      S.screen = "animales";
      S.b = { q: "", filtro: t.getAttribute("data-val") || "campo" };
      return pintar();
    }
    if (act === "filtro") {
      S.b.filtro = t.getAttribute("data-val");
      return pintar();
    }
    if (act === "inicio") return inicio();
    if (act === "ir") {
      var screen = t.getAttribute("data-screen");
      if (t.getAttribute("data-fresh")) return ir(screen, defaults(screen));
      return ir(screen, Object.assign({}, S.b));
    }
    if (act === "chip") {
      S.b[t.getAttribute("data-bind")] = t.getAttribute("data-val");
      S.error = "";
      return pintar();
    }
    if (act === "toggle") {
      var id = t.getAttribute("data-id");
      S.b.elegidos = S.b.elegidos || {};
      if (S.b.elegidos[id]) delete S.b.elegidos[id];
      else S.b.elegidos[id] = true;
      return pintar();
    }
    if (act === "todas") {
      S.b.elegidos = S.b.elegidos || {};
      var cat = t.getAttribute("data-cat");
      S.db.animales.forEach(function (a) {
        if (!a.deleted && a.estado === "activo" && a.categoria === cat) S.b.elegidos[a.id] = true;
      });
      return pintar();
    }
    if (act === "deshacer") {
      if (!S.deshacer) return;
      S.db = Store.deshacerContra(S.deshacer.db, S.db, uid());
      guardarLocal();
      subirNube();
      S.deshacer = null;
      S.banner = "Se deshizo.";
      S.b = {};
      S.screen = "home";
      S.pila = [];
      return pintar();
    }
    if (act === "login-google") return entrarGoogle();
    if (act === "login-google-igual") { S.probarIgual = true; return entrarGoogle(); }
    if (act === "login-mail") { S.b.loginMail = true; limpiarError(); return pintar(); }
    if (act === "login") return entrar();
    if (act === "empezar-caravanas") {
      if (!S.b.sexo || !S.b.categoria) { S.error = "Elegí sexo y categoría."; return pintar(); }
      S.b.cargadas = [];
      S.b.caravana = "";
      S.banner = "";
      return ir("caravanas", S.b);
    }
    if (act === "guardar-caravana") return guardarCaravana();
    if (act === "abrir-animal") return ir("animal", { id: t.getAttribute("data-id") });
    if (act === "guardar-animal") return guardarAnimal();
    if (act === "parto-seguir") {
      if (!S.b.madreId) { S.error = "Elegí la madre."; return pintar(); }
      S.b.fecha = S.b.fecha || L.hoyISO();
      return ir("parto-tipo", S.b);
    }
    if (act === "parto-crias") {
      if (!S.b.tipo) { S.error = "Elegí simple, mellizos o trillizos."; return pintar(); }
      S.b.facilidad = S.b.facilidad || "normal";
      S.b.corderos = [];
      S.b.sexo = "";
      S.b.vivo = "vivo";
      S.b.peso = "";
      S.b.caravana = "";
      return ir("parto-cria", S.b);
    }
    if (act === "cria-siguiente" || act === "cria-guardar") return guardarCria(act === "cria-guardar");
    if (act === "servicio-ovejas") {
      if (!S.b.carneroId && !S.b.semen) { S.error = "Elegí el carnero."; return pintar(); }
      S.b.fecha = S.b.fecha || L.hoyISO();
      S.b.elegidos = S.b.elegidos || {};
      return ir("servicio-ovejas", S.b);
    }
    if (act === "servicio-guardar") return guardarServicio(false);
    if (act === "servicio-igual") return guardarServicio(true);
    if (act === "ir-salida") return ir("servicio-salida", { servicioId: t.getAttribute("data-id"), salida: L.hoyISO() });
    if (act === "guardar-salida") return guardarSalida();
    if (act === "ir-diagnostico") return ir("diagnostico", { servicioId: t.getAttribute("data-id"), fecha: L.hoyISO(), resultados: {} });
    if (act === "diag") {
      S.b.resultados = S.b.resultados || {};
      S.b.resultados[t.getAttribute("data-id")] = t.getAttribute("data-val");
      return pintar();
    }
    if (act === "guardar-diagnostico") return guardarDiagnostico();
    if (act === "armar-seq") return empezarSeq(idsElegidos(), t.getAttribute("data-screen"));
    if (act === "destete-siguiente") return guardarItemPeso(true);
    if (act === "pesaje-categoria") {
      var ids = S.db.animales.filter(function (a) { return !a.deleted && a.estado === "activo" && a.categoria === S.b.categoria; }).map(function (a) { return a.id; });
      return empezarSeq(ids, "pesaje-seq");
    }
    if (act === "pesaje-lote") {
      var lote = L.porId(S.db.lotes, t.getAttribute("data-id"));
      return empezarSeq((lote && lote.animalIds) || [], "pesaje-seq");
    }
    if (act === "pesar-id" || act === "pesar-este") {
      var uno = act === "pesar-este" ? S.b.id : t.getAttribute("data-id");
      S.b.fecha = S.b.fecha || L.hoyISO();
      return empezarSeq([uno], "pesaje-seq");
    }
    if (act === "pesaje-siguiente") return guardarItemPeso(false);
    if (act === "mas") { S.b.mas = !S.b.mas; return pintar(); }
    if (act === "destetar-este") {
      S.b.fecha = L.hoyISO();

      var b = defaults("sanidad");

    }
    if (act === "sanidad-todos") return marcarSanidad(function (a) { return a.estado === "activo"; });
    if (act === "sanidad-cat") return marcarSanidad(function (a) { return a.estado === "activo" && a.categoria === t.getAttribute("data-cat"); });
    if (act === "sanidad-lote") {
      var loteS = L.porId(S.db.lotes, t.getAttribute("data-id"));

      ((loteS && loteS.animalIds) || []).forEach(function (id) { S.b.elegidos[id] = true; });

      return pintar();
    }
    if (act === "guardar-sanidad") return guardarSanidad();
    if (act === "guardar-hpg") return guardarHpg();
    if (act === "guardar-muerte") return guardarMuerte();
    if (act === "abrir-potrero") return ir("potrero", { id: t.getAttribute("data-id") });
    if (act === "guardar-potrero") return guardarPotrero();
    if (act === "editar-potrero") {
      var pot = L.porId(S.db.potreros, S.b.id);
      return ir("potrero-edit", { id: pot.id, nombre: pot.nombre, tipo: pot.tipo || "potrero", pastura: pot.pastura || "", hectareas: pot.hectareas == null ? "" : String(pot.hectareas).replace(".", ",") });

    if (act === "ir-mover") return ir("mover", { loteId: t.getAttribute("data-id"), fecha: L.hoyISO() });

    if (act === "armar-aca") return ir("lote-nuevo", { fecha: L.hoyISO(), elegidos: {}, nombre: "", potreroId: S.b.id });
    if (act === "guardar-lote") return guardarLote();
    if (act === "abrir-lote") return ir("lote", { id: t.getAttribute("data-id"), fecha: L.hoyISO() });
    if (act === "guardar-suplemento") return guardarSuplemento();
    if (act === "abrir-reporte") return ir("reporte", { reporte: t.getAttribute("data-id"), desde: ano() + "-01-01", hasta: L.hoyISO() });
    if (act === "refrescar") return pintar();
    if (act === "compartir") return compartir(S.b.textoCompartir || "Cabaña María Elena");
    if (act === "imprimir") return window.print();
    if (act === "export-json") return descargar("maria-elena-copia.json", JSON.stringify(S.db, null, 2), "application/json");
    if (act === "export-csv") return bajarCsv(t.getAttribute("data-tipo"));
    if (act === "pedir-import") return pedirImport();

      guardarLocal();
      subirNube();
      S.banner = "Saqué los datos de ejemplo.";

    }

      detenerEscucha();
      S.sinPermiso = false;

      S.accesoEstado = "";

      S.error = "";

  function onInput(e) {
    var el = e.target;
    if (!el.getAttribute || !el.getAttribute("data-bind")) return;
    S.b[el.getAttribute("data-bind")] = el.value;
    if (el.getAttribute("data-live")) {
      var pos = el.selectionStart;
      var bind = el.getAttribute("data-bind");
      pintar();
      var nuevo = document.querySelector('[data-bind="' + bind + '"]');
      if (nuevo) {
        nuevo.focus();
        if (nuevo.setSelectionRange && pos != null) nuevo.setSelectionRange(pos, pos);
      }
    }
  }

  function onChange(e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute("data-foto")) return cargarFoto(el.files && el.files[0]);
    if (el.id === "archivo-copia" && el.files && el.files[0]) return leerCopia(el.files[0]);
  }

  function onKey(e) {
    if (e.key !== "Enter") return;
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute("data-bind") === "caravana" && S.screen === "caravanas") {
      e.preventDefault();
      leerForm();
      guardarCaravana();
    }
    if (el.getAttribute("data-bind") === "peso" && (S.screen === "pesaje-seq" || S.screen === "destete-pesos")) {
      e.preventDefault();
      leerForm();
      guardarItemPeso(S.screen === "destete-pesos");
    }
  }

  function guardarCaravana() {
    var antes = Store.clonar(S.db);
    var res = Store.altaRapida(S.db, {
      caravanas: [S.b.caravana],
      sexo: S.b.sexo,
      categoria: S.b.categoria,
      raza: S.b.raza,
      potreroId: S.b.potreroId || ""
    }, uid());

      S.error = (res.avisos && res.avisos[0]) || "No se cargó.";
      return pintar();
    }
    S.db = res.db;
    guardarLocal();
    subirNube();
    S.deshacer = { db: antes };
    S.b.cargadas = (S.b.cargadas || []).concat([res.creados[0].caravana]);

    pintar();

  function guardarAnimal() {
    var a = L.porId(S.db.animales, S.b.id);
    var caravana = String(S.b.caravana || "").trim();
    if (caravana && !/^\d+$/.test(caravana)) { S.error = "La caravana tiene que ser un número."; return pintar(); }
    if (caravana && S.db.animales.some(function (x) { return !x.deleted && x.caravana === caravana && x.id !== a.id; })) {
      S.error = "Esa caravana ya está usada.";
      return pintar();
    }
    var res = Store.guardarAnimal(S.db, Object.assign({}, a, {
      caravana: caravana,
      sexo: S.b.sexo,
      categoria: S.b.categoria,
      raza: S.b.raza,
      nacimiento: S.b.nacimiento || "",
      estado: S.b.estado,
      potreroId: S.b.potreroId || "",
      madreId: S.b.madreId || "",
      padreId: S.b.padreId || ""
    }), uid());
    S.b.texto = "Quedaron guardados los datos.";
    aplicar({ ok: true, db: res.db }, "Quedaron guardados los datos.");
  }

      S.b.sexo = "";
      S.b.vivo = "vivo";
      S.b.peso = "";
      S.b.caravana = "";

    }

  function htmlDiag(siempre) {
    if (!siempre && !diagnosticoActivo()) return "";
    var user = cloud.auth && cloud.auth.currentUser;
    var cfg = root.FIREBASE_CONFIG || {};
    var last = S.ultimoError;
    var lastTxt = "ninguno";
    if (last) {
      try { lastTxt = JSON.stringify(last); } catch (e) { lastTxt = String(last); }
    }
    var lineas = [
      "SDK: " + (S.firebaseVersion || "?"),
      "authDomain: " + (cfg.authDomain || ""),
      "resolver: " + (cloud.authApi && cloud.authApi.browserPopupRedirectResolver ? "sí" : "no"),
      "usuario: " + (user ? ((user.email || "") + " " + user.uid + (user.isAnonymous ? " (anónimo)" : "")) : "ninguno"),
      "último error: " + lastTxt,
      "caché: " + (S.cacheTipo || "?") + " · acceso: " + (S.accesoEstado || "-") + " · señal: " + (navigator.onLine ? "sí" : "no"),
      "pasos:"
    ].concat(S.pasos.map(function (x) { return "  " + x; }));
    return '<pre class="login-diag">' + esc(lineas.join("\n")) + "</pre>";
  }

  function htmlErrorLogin() {
    if (!S.error && !S.errorCodigo && !S.errorDetalle && !S.errorOrigen) return "";
    var html = "";
    if (S.error) html += '<div class="error">' + esc(S.error) + "</div>";
    html += '<p class="login-uid">';
    html += "código: " + esc(S.errorCodigo || "sin código");
    if (S.errorOrigen) html += " · origen: " + esc(S.errorOrigen);
    if (S.errorDetalle) html += "<br>" + esc(S.errorDetalle);
    html += "</p>";
    return html;
  }

  function limpiarError() {
    S.error = "";
    S.errorCodigo = "";
    S.errorDetalle = "";
    S.errorOrigen = "";
  }

  function describirError(err) {
    var d = { code: "", name: "", message: "", tipo: typeof err };
    if (err == null) {
      d.message = "sin objeto de error";
      return d;
    }
    if (typeof err === "string" || typeof err === "number") {
      d.message = String(err);
      return d;
    }
    d.name = err.name ? String(err.name) : "";
    if (err.message) d.message = String(err.message);
    else if (typeof err.toString === "function") {
      try { d.message = String(err.toString()); } catch (e) { d.message = ""; }
    }
    if (typeof err.code === "string" && err.code) d.code = err.code;
    else if (err.customData && typeof err.customData.code === "string" && err.customData.code) d.code = err.customData.code;
    else if (typeof err.code === "number") {
      d.message = (d.message ? d.message + " " : "") + "(code=" + err.code + ")";
    }
    if (d.message && d.message.length > 240) d.message = d.message.slice(0, 237) + "…";
    return d;
  }

  function mensajeAuth(err) {
    var c = describirError(err).code;
    if (c === "auth/invalid-email") return "Ese correo no es válido.";
    if (c === "auth/user-disabled") return "Esa cuenta está deshabilitada.";
    if (c === "auth/user-not-found" || c === "auth/wrong-password" || c === "auth/invalid-credential") return "Correo o contraseña incorrectos.";
    if (c === "auth/too-many-requests") return "Demasiados intentos. Probá en un rato.";
    if (c === "auth/network-request-failed") return "Sin conexión. Probá cuando haya señal.";
    if (c === "auth/popup-closed-by-user") return "Cerraste la ventana de Google.";
    if (c === "auth/cancelled-popup-request") return "Se canceló la ventana de Google.";
    if (c === "auth/popup-blocked") return "El iPhone bloqueó la ventana de Google. Tocá de nuevo «Entrar con Google».";
    if (c === "auth/unauthorized-domain") return "Este dominio no está autorizado en Firebase.";
    if (c === "auth/operation-not-supported-in-this-environment") return "Este navegador no pudo abrir la ventana de Google.";
    return "No se pudo entrar. Probá de nuevo.";
  }

  function mostrarErrorAuth(err, origen) {
    var d = describirError(err);
    S.errorOrigen = origen || S.errorOrigen || "";
    S.errorCodigo = d.code || "";
    S.errorDetalle = ((d.name || "") + (d.name && d.message ? ": " : "") + (d.message || "")).trim();
    S.error = mensajeAuth(err);
    S.ultimoError = {
      origen: S.errorOrigen,
      code: d.code || "sin código",
      name: d.name || "",
      message: d.message || "",
      tipo: d.tipo
    };
    var btn = document.querySelector('[data-act="login-google"]');
    if (btn) btn.disabled = false;
    pintar();
  }

  function debeUsarRedirect(err) {
    return describirError(err).code === "auth/popup-blocked";
  }

  function entrar() {
    if (!cloud.auth || !cloud.authApi) {
      mostrarErrorAuth({ name: "Error", message: "La nube no está lista." }, "init");
      S.error = "La nube no está lista.";
      return pintar();
    }
    var email = String(S.b.email || "").trim();
    var clave = S.b.clave || "";
    if (!email || !clave) {
      limpiarError();
      S.error = "Escribí el correo y la contraseña.";
      return pintar();
    }
    limpiarError();
    pintar();
    cloud.authApi.signInWithEmailAndPassword(cloud.auth, email, clave).catch(function (err) {
      mostrarErrorAuth(err, "estado");
    });
  }

  function entrarGoogle() {
    if (!cloud.auth || !cloud.authApi || !cloud.authApi.signInWithPopup) {
      mostrarErrorAuth({ name: "Error", message: "La nube no está lista o falta signInWithPopup." }, "init");
      S.error = "La nube no está lista.";
      return pintar();
    }
    var A = cloud.authApi;
    var G = root.TGAuth;
    var mismo = !!(G && G.mismoOrigen(root.FIREBASE_CONFIG || {}));
    limpiarError();
    var provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    var resolver = A.browserPopupRedirectResolver;
    function porRedirect() {
      if (G) G.marcarIntento("redirect");
      A.signInWithRedirect(cloud.auth, provider, resolver).catch(function (err) { S.avisoSafari = true; mostrarErrorAuth(err, "redirect"); });
    }
    // Navegador interno de otra app (WebView): la ventana de Google no funciona.
    if (G && G.enAppInterna() && !S.probarIgual) {
      if (mismo && A.signInWithRedirect) return porRedirect();
      S.avisoSafari = true;
      return pintar();
    }
    var btn = document.querySelector('[data-act="login-google"]');
    if (btn) btn.disabled = true;
    if (G) G.marcarIntento("popup");
    try {
      // Ventana emergente. En github.io nunca se cae a redirect (el iPhone pierde el estado entre github.io y firebaseapp.com).
      A.signInWithPopup(cloud.auth, provider, resolver).catch(function (err) {
        var c = describirError(err).code;
        var ventanaRota = c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/web-storage-unsupported";
        if (mismo && ventanaRota && A.signInWithRedirect) return porRedirect();
        if (G && G.esFallaDeVentana(c)) S.avisoSafari = true;
        mostrarErrorAuth(err, "popup");
      });
    } catch (err) {
      S.avisoSafari = true;
      mostrarErrorAuth(err, "popup");
    }
  }

  function descargar(nombre, texto, tipo) {
    var blob = new Blob([texto], { type: tipo || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }

  function bajarCsv(tipo) {
    var csv = tipo === "animales" ? L.csvAnimales(S.db) : L.csvEventos(S.db, tipo);
    descargar("maria-elena-" + tipo + ".csv", csv, "text/csv;charset=utf-8");
  }

  function pedirImport() {
    var input = document.createElement("input");
    input.type = "file";
    input.id = "archivo-copia";
    input.accept = "application/json";
    input.addEventListener("change", onChange);
    input.click();
  }

  function leerCopia(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var db = JSON.parse(String(reader.result || ""));
        if (!db || db.version !== 1 || !db.animales) throw new Error("malo");
        S.importPendiente = Store.cargar(db);
        ir("importar", {});
      } catch (err) {
        S.error = "Ese archivo no es una copia de esta app.";
        pintar();
      }
    };
    reader.readAsText(file);
  }

  function confirmarImport() {
    if (!S.importPendiente) return;
    S.db = S.importPendiente;
    S.importPendiente = null;
    guardarLocal();
    subirNube();
    S.banner = "Traje la copia.";
    S.conservarBanner = true;
    inicio();
  }

  function compartir(texto) {
    var data = { title: "Cabaña María Elena", text: texto };
    if (navigator.share) navigator.share(data).catch(function () {});
    else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () {
        S.banner = "Copié el texto. Pegalo en WhatsApp.";
        pintar();
      }).catch(function () {});
    }
  }

  function cargarFoto(file) {
    if (!file) return;
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 900;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * escala));
      canvas.height = Math.max(1, Math.round(img.height * escala));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      var data = canvas.toDataURL("image/jpeg", 0.6);
      URL.revokeObjectURL(url);
      if (data.length > 450000) S.b.sinFoto = true;
      else { S.b.foto = data; S.b.sinFoto = false; }
      pintar();
    };
    img.onerror = function () { URL.revokeObjectURL(url); };
    img.src = url;
  }

  function prepararNube(cfg) {
    var v = "10.14.1";
    S.firebaseVersion = v;
    var base = "https://www.gstatic.com/firebasejs/" + v + "/";
    paso("cargando SDK " + v);
    var sdk = conTiempo(Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-auth.js"),
      import(base + "firebase-firestore.js")
    ]), 15000, "SDK");
    Promise.all([sdk, probarIndexedDB(2500)]).then(function (res) {
      var mods = res[0], idb = res[1];
      paso("SDK cargado");
      var appMod = mods[0], authMod = mods[1], fsMod = mods[2];
      // Nombre propio: en el mismo origen, [DEFAULT] comparte el IndexedDB de Firestore y en Safari las otras pestañas se cuelgan.
      var app = appMod.initializeApp(cfg, "maria-elena");
      var auth;
      try {
        auth = authMod.initializeAuth(app, {
          persistence: idb.ok
            ? [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence]
            : [authMod.browserLocalPersistence, authMod.inMemoryPersistence],
          popupRedirectResolver: authMod.browserPopupRedirectResolver
        });
      } catch (e) {
        paso("initializeAuth falló: " + describirError(e).message);
        auth = authMod.getAuth(app);
      }
      paso("auth lista");
      var fs = null;
      if (idb.ok) {
        try {
          fs = fsMod.initializeFirestore(app, {
            localCache: fsMod.persistentLocalCache({
              tabManager: fsMod.persistentMultipleTabManager()
            })
          });
          S.cacheTipo = "persistente";
        } catch (e) {
          paso("caché persistente falló: " + describirError(e).message);
          fs = null;
        }
      } else {
        paso("sin caché persistente: " + idb.por);
      }
      if (!fs) {
        try {
          fs = fsMod.initializeFirestore(app, { localCache: fsMod.memoryLocalCache() });
          S.cacheTipo = "memoria";
        } catch (e) {
          fs = fsMod.getFirestore(app);
          S.cacheTipo = "memoria (por defecto)";
        }
      }
      paso("firestore lista (" + S.cacheTipo + ")");
      cloud.app = app;
      cloud.auth = auth;
      cloud.fs = fs;
      cloud.authApi = authMod;
      cloud.fsApi = fsMod;
      cloud.signOut = function () { return authMod.signOut(auth).catch(function () {}); };
      authMod.onAuthStateChanged(auth, function (user) {
        if (user && root.TGAuth) { root.TGAuth.limpiarIntento(); S.avisoSafari = false; }
        paso("estado de sesión: " + (user ? (user.isAnonymous ? "anónimo" : (user.email || user.uid)) : "sin sesión"));
        if (S.nubeEstado === "cargando") S.nubeEstado = "lista";
        try {
          alCambiarUsuario(user);
        } catch (err) {
          mostrarErrorAuth(err, "estado");
        }
      }, function (err) {
        S.nubeEstado = "lista";
        mostrarErrorAuth(err, "estado");
      });
      authMod.getRedirectResult(auth).then(function () {
        paso("redirect revisado");
      }).catch(function (err) {
        var c = describirError(err).code;
        if (c !== "auth/no-auth-event") { S.avisoSafari = true; mostrarErrorAuth(err, "redirect-result"); }
      });
      armarVigia("sesión");
    }).catch(function (err) {
      paso("falló la nube: " + describirError(err).message);
      S.modo = "local";
      S.sync = "local";
      S.nubeEstado = "falla";
      S.banner = "No se pudo abrir la nube. Seguís en este aparato.";
      mostrarErrorAuth(err, "init");
    });
  }

  function alCambiarUsuario(user) {
    detenerEscucha();
    if (!user || user.isAnonymous) {
      if (user && user.isAnonymous && cloud.signOut) {
        cloud.signOut();
        return;
      }
      S.usuario = null;
      S.sinPermiso = false;
      S.accesoEstado = "";
      S.errorCarga = "";
      pintar();
      return;
    }
    S.usuario = { uid: user.uid, email: user.email || "" };
    S.sinPermiso = false;
    S.errorCarga = "";
    cloud.subido = {};
    cloud.metaOk = false;
    var uidActual = user.uid;
    if (leerAccesoGuardado(user.uid) === "1") {
      // Permiso ya confirmado antes en este aparato: entra directo (con o sin señal) y se revisa en segundo plano.
      S.accesoEstado = "ok";
      if (vigia) { clearTimeout(vigia); vigia = null; }
      limpiarError();
      escuchar();
      pintar();
      paso("pantalla de inicio (permiso guardado)");
      migrarLocalANube().catch(function (err) { paso("migración: " + describirError(err).message); });
      verificarAcceso(user).then(function (ok) {
        if (ok || !S.usuario || S.usuario.uid !== uidActual) return;
        detenerEscucha();
        S.accesoEstado = "no";
        S.sinPermiso = true;
        pintar();
      }).catch(function () {});
      return;
    }
    S.accesoEstado = "verificando";
    pintar();
    armarVigia("permiso");
    verificarAcceso(user).then(function (ok) {
      if (!S.usuario || S.usuario.uid !== uidActual) return;
      if (!ok) {
        S.accesoEstado = "no";
        S.sinPermiso = true;
        S.errorCarga = "";
        pintar();
        return;
      }
      S.accesoEstado = "ok";
      S.sinPermiso = false;
      S.errorCarga = "";
      limpiarError();
      escuchar();
      pintar();
      paso("pantalla de inicio");
      migrarLocalANube().catch(function (err) {
        paso("migración: " + describirError(err).message);
      });
    }).catch(function (err) {
      if (!S.usuario || S.usuario.uid !== uidActual) return;
      var d = describirError(err);
      paso("permiso falló: " + (d.code || "") + " " + d.message);
      S.accesoEstado = "error";
      S.errorCarga = d.code === "timeout" || d.code === "unavailable"
        ? "No se pudo confirmar tu permiso con la nube. Revisá la señal y tocá Reintentar."
        : "No se pudo confirmar tu permiso (" + (d.code || "error") + "). Tocá Reintentar.";
      S.ultimoError = { origen: "accesos", code: d.code || "sin código", name: d.name || "", message: d.message || "", tipo: d.tipo };
      pintar();
    });
  }

  function leerAccesoGuardado(uidX) {
    try { return localStorage.getItem(ACCESO_KEY + uidX); } catch (e) { return null; }
  }

  function guardarAcceso(uidX, ok) {
    try { localStorage.setItem(ACCESO_KEY + uidX, ok ? "1" : "0"); } catch (e) {}
  }

  function verificarAcceso(user) {
    var FS = cloud.fsApi;
    var ref = FS.doc(cloud.fs, "accesos", user.uid);
    paso("leyendo permiso");
    return conTiempo(FS.getDoc(ref), 8000, "permiso").then(function (snap) {
      var ok = false;
      if (snap.exists()) {
        var d = snap.data() || {};
        var apps = d.apps || [];
        ok = d.rol === "admin" || (Object.prototype.toString.call(apps) === "[object Array]" && apps.indexOf("maria-elena") >= 0);
      }
      paso("permiso: " + (ok ? "sí" : "no") + (snap.metadata && snap.metadata.fromCache ? " (caché)" : ""));
      guardarAcceso(user.uid, ok);
      return ok;
    }).catch(function (err) {
      if (err && err.code === "permission-denied") {
        guardarAcceso(user.uid, false);
        paso("permiso: denegado por reglas");
        return false;
      }
      if (leerAccesoGuardado(user.uid) === "1") {
        paso("permiso guardado en el aparato (" + (err && err.code ? err.code : "sin respuesta") + ")");
        return true;
      }
      throw err;
    });
  }

  function detenerEscucha() {
    (cloud.unsubs || []).forEach(function (u) { try { u(); } catch (e) {} });
    cloud.unsubs = [];
  }

  function refEst() {
    return cloud.fsApi.doc(cloud.fs, "establecimientos", "maria-elena");
  }

  function colEst(nombre) {
    return cloud.fsApi.collection(cloud.fs, "establecimientos", "maria-elena", nombre);
  }

  function docEst(nombre, id) {
    return cloud.fsApi.doc(cloud.fs, "establecimientos", "maria-elena", nombre, id);
  }

  function datoLimpio(row) {
    return JSON.parse(JSON.stringify(row));
  }

  function migrarLocalANube() {
    if (!cloud.fs || !S.usuario) return Promise.resolve();
    var ya = false;
    try { ya = localStorage.getItem(MIGRA_KEY) === "1"; } catch (e) {}
    if (ya) return Promise.resolve();
    var FS = cloud.fsApi;
    var meta = {
      nombre: "Cabaña María Elena",
      lugar: "Coronel Oviedo",
      hectareas: 5,
      raza: "Dorper",
      updatedAt: new Date().toISOString()
    };
    paso("migración en segundo plano");
    cloud.metaOk = true;
    var pendientes = [FS.setDoc(refEst(), meta, { merge: true })];
    var cadena = Promise.resolve();
    COLECCIONES.forEach(function (nombre) {
      cadena = cadena.then(function () {
        return FS.getDocs(colEst(nombre)).then(function (snap) {
          var remoto = {};
          snap.forEach(function (d) { remoto[d.id] = d.data() || {}; });
          var ops = [];
          (S.db[nombre] || []).forEach(function (row) {
            if (!row.id) return;
            var rem = remoto[row.id];
            if (!rem || String(row.updatedAt || "") >= String(rem.updatedAt || "")) ops.push(row);
          });
          pendientes.push(enviarDocs(nombre, ops));
        });
      });
    });
    return cadena.then(function () {
      return Promise.all(pendientes);
    }).then(function () {
      try { localStorage.setItem(MIGRA_KEY, "1"); } catch (e) {}
      paso("migración confirmada");
    }).catch(function (err) {
      paso("migración pendiente: " + describirError(err).message);
      if (err && err.code === "permission-denied") {
        S.sinPermiso = true;
        pintar();
      }
    });
  }

  function escuchar() {
    if (!cloud.fs || (cloud.unsubs && cloud.unsubs.length)) return;
    cloud.unsubs = [];
    var FS = cloud.fsApi;
    COLECCIONES.forEach(function (nombre) {
      var unsub = FS.onSnapshot(colEst(nombre), { includeMetadataChanges: true }, function (snap) {
        var rows = [];
        snap.forEach(function (d) {
          var data = d.data() || {};
          if (!data.id) data.id = d.id;
          rows.push(data);
        });
        fusionar(nombre, rows);
        if (snap.metadata.hasPendingWrites) marcarSync("pending");
        else if (snap.metadata.fromCache || !navigator.onLine) marcarSync("offline");
        else marcarSync("ok");
        if (!document.activeElement || document.activeElement.tagName !== "INPUT") pintar();
      }, function (err) {
        if (err && err.code === "permission-denied") {
          S.sinPermiso = true;
          detenerEscucha();
          pintar();
        } else marcarSync("offline");
      });
      cloud.unsubs.push(unsub);
    });
  }

  function fusionar(nombre, rows) {
    if (!rows.length) {
      if (!semilla[nombre] && (S.db[nombre] || []).length) {
        semilla[nombre] = true;
        subirColeccion(nombre);
      }
      return;
    }
    var local = {};
    (S.db[nombre] || []).forEach(function (r) { local[r.id] = r; });
    var salida = [];
    var faltan = [];
    var sub = cloud.subido[nombre] || (cloud.subido[nombre] = {});
    rows.forEach(function (r) {
      sub[r.id] = estable(datoLimpio(r));
      var loc = local[r.id];
      if (!loc || String(r.updatedAt || "") >= String(loc.updatedAt || "")) salida.push(r);
      else salida.push(loc);
      delete local[r.id];
    });
    Object.keys(local).forEach(function (id) {
      salida.push(local[id]);
      faltan.push(local[id]);
    });
    S.db[nombre] = salida;
    guardarLocal();
    if (faltan.length) subirDocs(nombre, faltan);
  }

  function subirNube() {
    if (S.modo !== "cloud" || !S.usuario || !cloud.fs || S.sinPermiso) return;
    var ops = [];
    if (!cloud.metaOk) {
      cloud.metaOk = true;
      ops.push({ ref: refEst(), data: {
        nombre: "Cabaña María Elena",
        lugar: "Coronel Oviedo",
        hectareas: 5,
        raza: "Dorper",
        updatedAt: new Date().toISOString()
      } });
    }
    COLECCIONES.forEach(function (nombre) {
      var sub = cloud.subido[nombre] || (cloud.subido[nombre] = {});
      (S.db[nombre] || []).forEach(function (row) {
        if (!row.id) return;
        var data = datoLimpio(row);
        var firma = estable(data);
        if (sub[row.id] === firma) return;
        sub[row.id] = firma;
        ops.push({ ref: docEst(nombre, row.id), data: data });
      });
    });
    if (!ops.length) return;
    marcarSync(navigator.onLine ? "pending" : "offline");
    enviarLotes(ops).catch(function (err) {
      marcarSync("offline");
      if (err && err.code === "permission-denied") {
        S.sinPermiso = true;
        pintar();
      }
    });
  }

  function enviarLotes(ops) {
    var FS = cloud.fsApi;
    var promesas = [];
    for (var i = 0; i < ops.length; i += 400) {
      var batch = FS.writeBatch(cloud.fs);
      var parte = ops.slice(i, i + 400);
      parte.forEach(function (op) { batch.set(op.ref, op.data, { merge: true }); });
      promesas.push(confirmarLote(batch.commit(), parte.length));
    }
    return Promise.all(promesas);
  }

  function confirmarLote(promesa, n) {
    var aviso = setTimeout(function () { paso("escritura sin confirmar a los 20 s (" + n + " docs; sin señal o cuota)"); }, 20000);
    return promesa.then(function () {
      clearTimeout(aviso);
    }, function (e) {
      clearTimeout(aviso);
      paso("escritura rechazada: " + (describirError(e).code || describirError(e).message));
      throw e;
    });
  }

  function enviarDocs(nombre, rows) {
    if (!rows || !rows.length) return Promise.resolve();
    var sub = cloud.subido[nombre] || (cloud.subido[nombre] = {});
    var ops = [];
    rows.forEach(function (row) {
      if (!row || !row.id) return;
      var data = datoLimpio(row);
      var firma = estable(data);
      if (sub[row.id] === firma) return;
      sub[row.id] = firma;
      ops.push({ ref: docEst(nombre, row.id), data: data });
    });
    return enviarLotes(ops);
  }

  function subirColeccion(nombre) {
    subirDocs(nombre, S.db[nombre] || []);
  }

  function subirDocs(nombre, rows) {
    if (!cloud.fs || !rows || !rows.length || S.sinPermiso) return;
    enviarDocs(nombre, rows).catch(function () { marcarSync("offline"); });
  }

  root.MEUI = { boot: boot };
})(typeof globalThis !== "undefined" ? globalThis : this);

MEUI.boot();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "/maria-elena/" }).catch(function () {});
}
</script>
