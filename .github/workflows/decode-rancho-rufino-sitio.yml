name: Decode Rancho Rufino site

on:
  push:
    branches: [main]
    paths:
      - "rancho-rufino/.publish/sitio.tar.gz.b64"
      - ".github/workflows/decode-rancho-rufino-sitio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace rancho-rufino/ from payload
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, tarfile, shutil

          folder = pathlib.Path("rancho-rufino")
          payload = folder / ".publish" / "sitio.tar.gz.b64"
          if not payload.exists():
              raise SystemExit("missing " + str(payload))
          raw = base64.b64decode(payload.read_text().strip())

          if folder.exists():
              for p in folder.rglob("*"):
                  if p.is_file() and ".publish" not in p.parts:
                      p.unlink()
              for p in sorted((p for p in folder.rglob("*") if p.is_dir()), reverse=True):
                  if p == folder or ".publish" in p.parts:
                      continue
                  try:
                      p.rmdir()
                  except OSError:
                      pass

          folder.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
              for m in tf.getmembers():
                  name = pathlib.Path(m.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"blocked path {m.name}")
              try:
                  tf.extractall(folder, filter="data")
              except TypeError:
                  tf.extractall(folder)

          pub = folder / ".publish"
          if pub.exists():
              shutil.rmtree(pub)

          files = [p for p in folder.rglob("*") if p.is_file()]
          print("extracted", len(files), "files into rancho-rufino/")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rancho-rufino
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
          else
            git commit -m "Actualiza los archivos de Rancho Rufino en /rancho-rufino/"
            git pull --rebase --quiet || git pull --rebase
            git push
          fi
