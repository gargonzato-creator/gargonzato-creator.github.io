name: Decode Rancho Rufino binaries

on:
  push:
    branches: [main]
    paths:
      - "rancho-rufino/**/*.b64"
      - ".github/workflows/decode-rancho-rufino-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode binaries and commit
        run: |
          python3 - <<'PY'
          import base64, pathlib
          root = pathlib.Path("rancho-rufino")
          if not root.exists():
              raise SystemExit("missing rancho-rufino/")
          written = []
          for src in sorted(root.rglob("*.b64")):
              dest = src.with_name(src.name[:-4])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(src.read_text().strip()))
              written.append(f"{dest} {dest.stat().st_size}")
          print("wrote", written)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rancho-rufino
          if git diff --cached --quiet; then
            echo "Binaries already committed"
          else
            git commit -m "Agrega los archivos binarios decodificados de Rancho Rufino"
            git pull --rebase --quiet || true
            git push
          fi
